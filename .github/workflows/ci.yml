name: Test
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install '.[dev]'
      - name: Run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
      - name: Lint
        run: ruff check src tests
