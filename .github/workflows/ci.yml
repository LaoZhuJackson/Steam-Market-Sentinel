name: Test
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install '.[dev]'
      - name: Install Qt runtime libraries
        # PySide6 needs these even for the offscreen platform. Without libGL/libEGL
        # the PySide6.QtWidgets import dies and the UI tests fail at *collection*
        # (pytest exit code 2), which is what this job used to do.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
      - name: Lint
        run: ruff check src tests
